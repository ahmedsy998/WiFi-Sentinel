name: WiFi Sentinel Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK (Modern Packages Only)
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_ROOT}/cmdline-tools/bin/sdkmanager" \
            $(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -name sdkmanager 2>/dev/null || true); do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under ${SDK_ROOT}"
            exit 1
          fi

          echo "Using sdkmanager: ${SDKMANAGER}"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"

          # Accept Android SDK licenses non-interactively
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true

          # Update cmdline-tools first (never install legacy 'tools' package)
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "cmdline-tools;latest"
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          # Install exact modern SDK packages matching compileSdk 36.1 / targetSdk 36 / AGP 9.1.1
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          # Accept any newly added licenses after installing API 36 / 36.1
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
        continue-on-error: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: |
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Prepare debug signing keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -f debug.keystore

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK Output Exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-sentinel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
